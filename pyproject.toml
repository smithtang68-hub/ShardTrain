[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shardtrain"
version = "0.1.0"
description = "Correctness-first sharded LLM training runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch==2.9.1", "PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "hypothesis==6.151.9", "ruff==0.14.14"]
qwen = ["transformers==4.57.3", "safetensors==0.7.0"]

[project.scripts]
shardtrain = "sharded_runtime.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["distributed: subprocess integration tests with process timeouts"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
