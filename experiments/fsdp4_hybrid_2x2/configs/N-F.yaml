model:
  model_type: qwen2
  hf_config_path: configs/qwen25_1p5b_config.yaml
  checkpoint_path: ''
  vocab_size: 151936
  layers: 28
  hidden_size: 1536
  num_heads: 12
  num_key_value_heads: 2
  mlp_hidden_size: 8960
  seq_len: 512
  rope_theta: 1000000.0
  tie_word_embeddings: true
  rms_norm_eps: 1.0e-06
parallel:
  fsdp_degree: 4
  tp_degree: 1
  sp_enabled: false
  device: cuda
  backend: nccl
runtime:
  param_grouping: block
  reshard_after_forward: true
  forward_prefetch: true
  backward_prefetch: true
  async_grad_rs: true
  communication_policy: stream_ordered
training:
  dtype: fp16
  optimizer: adamw
  lr: 1.0e-05
  steps: 30
  local_batch_size: 2
  accumulation_steps: 2
  seed: 1234
debug:
  output_dir: runs/fsdp-interview-placeholder
  distributed_timeout_seconds: 120
