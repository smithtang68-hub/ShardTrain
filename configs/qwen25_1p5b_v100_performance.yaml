# Large performance preset derived from the 20261013 four-GPU capacity search.
# Tested arguments: S512, local batch 10, F2/T2/SP, flags111, accumulation 1.
# Random initialization and repeated synthetic GPU-resident inputs.
# Headroom applies to the recorded PG503-216 server, not every V100 topology.
model:
  model_type: qwen2
  hf_config_path: configs/qwen25_1p5b_config.yaml
  checkpoint_path: ""
  vocab_size: 151936
  layers: 28
  hidden_size: 1536
  num_heads: 12
  num_key_value_heads: 2
  mlp_hidden_size: 8960
  seq_len: 512
  rope_theta: 1000000.0
  tie_word_embeddings: true
  rms_norm_eps: 0.000001
parallel:
  fsdp_degree: 2
  tp_degree: 2
  sp_enabled: true
  device: cuda
  backend: nccl
runtime:
  param_grouping: block
  reshard_after_forward: true
  forward_prefetch: true
  backward_prefetch: true
  async_grad_rs: true
  communication_policy: stream_ordered
training:
  dtype: fp16
  optimizer: adamw
  lr: 0.00001
  steps: 40
  local_batch_size: 10
  accumulation_steps: 1
  seed: 1234
debug:
  output_dir: runs/qwen25-1p5b-v100-performance
  distributed_timeout_seconds: 180
