# Prepared V100 x4 workload. Hardware/official checkpoint validation must be run separately.
# With checkpoint_path empty, weights are deterministic random initialization.
model:
  model_type: qwen2
  hf_config_path: configs/qwen25_1p5b_config.yaml
  checkpoint_path: ""
  vocab_size: 151936
  layers: 28
  hidden_size: 1536
  num_heads: 12
  num_key_value_heads: 2
  mlp_hidden_size: 8960
  seq_len: 128
  rope_theta: 1000000.0
  tie_word_embeddings: true
  rms_norm_eps: 0.000001
parallel:
  fsdp_degree: 2
  tp_degree: 2
  sp_enabled: true
  device: cuda
  backend: nccl
runtime:
  param_grouping: block
  reshard_after_forward: true
  forward_prefetch: false
  backward_prefetch: false
  async_grad_rs: false
  communication_policy: conservative
training:
  dtype: fp16
  optimizer: adamw
  lr: 0.00001
  steps: 10
  local_batch_size: 1
  accumulation_steps: 1
  seed: 1234
debug:
  output_dir: runs/qwen25-1p5b-v100
  distributed_timeout_seconds: 180
