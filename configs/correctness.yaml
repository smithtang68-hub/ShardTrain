# M0: unpartitioned reference. Distributed training is enabled in later milestones.
model:
  layers: 1
  hidden_size: 128
  num_heads: 4
  mlp_hidden_size: 256
  seq_len: 16
  dropout: 0.0
parallel:
  fsdp_degree: 1
  tp_degree: 1
  sp_enabled: false
  device: cpu
  backend: gloo
runtime:
  reshard_after_forward: false
  materialization: synchronous
  prefetch: none
  param_grouping: submodule
training:
  dtype: fp32
  optimizer: sgd
  lr: 0.001
  steps: 3
  local_batch_size: 2
  accumulation_steps: 1
  seed: 1234
debug:
  log_level: INFO
  distributed_timeout_seconds: 30
  output_dir: runs/reference
