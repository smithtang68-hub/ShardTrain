# CPU smoke/reference workload. This is a tiny architecture, not official weights.
model:
  model_type: qwen2
  vocab_size: 128
  layers: 2
  hidden_size: 32
  num_heads: 4
  num_key_value_heads: 2
  mlp_hidden_size: 64
  seq_len: 16
  rope_theta: 1000000.0
  tie_word_embeddings: true
  rms_norm_eps: 0.000001
parallel:
  fsdp_degree: 1
  tp_degree: 1
  sp_enabled: false
  device: cpu
  backend: gloo
runtime:
  param_grouping: block
  reshard_after_forward: true
  forward_prefetch: false
  backward_prefetch: false
  async_grad_rs: false
  communication_policy: conservative
training:
  dtype: fp32
  optimizer: adamw
  lr: 0.0001
  steps: 3
  local_batch_size: 2
  accumulation_steps: 1
  seed: 1234
debug:
  output_dir: runs/qwen25-tiny
  distributed_timeout_seconds: 60
